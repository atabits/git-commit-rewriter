[package]
name = "commit-rewriter"
version = "2.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Amin Atabiev"]
description = "Git commit message rewriter with GUI"
repository = "https://github.com/atabits/git-commit-rewriter"
license = "MIT"

[dependencies]
eframe = "0.36"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
chrono = "0.4"
rfd = "0.17"
pollster = "0.4"
anyhow = "1.0"

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary

[[bin]]
name = "commit-rewriter"
path = "src/main.rs"


