name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Only semantic versions: v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Manual dry run: builds artifacts without creating a release

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build macOS DMG (GitHub-hosted Apple Silicon runner, Intel cross-compiled)
  build-macos:
    name: Build macOS DMG (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m 1 "^version" Cargo.toml | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build macOS DMG
        run: ./scripts/build-macos-app.sh ${{ matrix.arch }}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Verify DMG file
        id: verify_dmg
        run: |
          DMG_FILE=$(find releases -name "*macos-${{ matrix.arch }}.dmg" -type f | head -1)
          if [ -z "$DMG_FILE" ]; then
            echo "❌ Error: DMG file not found"
            exit 1
          fi
          echo "DMG_FILE=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "✅ DMG file found: $DMG_FILE"
          ls -lh "$DMG_FILE"
          # Verify file is not empty
          if [ ! -s "$DMG_FILE" ]; then
            echo "❌ Error: DMG file is empty"
            exit 1
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: ${{ steps.verify_dmg.outputs.DMG_FILE }}
          retention-days: 7

  # Build Windows EXE (cross-compiled with MinGW on GitHub-hosted Linux runner)
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m 1 "^version" Cargo.toml | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 zip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Windows EXE
        run: ./scripts/build-windows.sh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Verify Windows ZIP file
        id: verify_zip
        run: |
          ZIP_FILE=$(find releases -name "*windows-portable.zip" -type f | head -1)
          if [ -z "$ZIP_FILE" ] || [ ! -s "$ZIP_FILE" ]; then
            echo "❌ Error: Windows ZIP file not found or empty"
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_OUTPUT
          echo "✅ Windows ZIP file found: $ZIP_FILE"
          ls -lh "$ZIP_FILE"

      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: ${{ steps.verify_zip.outputs.ZIP_FILE }}
          retention-days: 7

  # Build Linux tarball and AppImage (native, GitHub-hosted runners)
  build-linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -m 1 "^version" Cargo.toml | sed 's/version = "\(.*\)"/\1/' | tr -d ' ')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build Linux packages
        run: ./scripts/build-linux.sh
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Verify Linux files
        run: |
          for PATTERN in "*linux-${{ matrix.arch }}.tar.gz" "*linux-${{ matrix.arch }}.AppImage"; do
            FILE=$(find releases -name "$PATTERN" -type f | head -1)
            if [ -z "$FILE" ] || [ ! -s "$FILE" ]; then
              echo "❌ Error: $PATTERN not found or empty"
              exit 1
            fi
            echo "✅ Found: $FILE"
            ls -lh "$FILE"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            releases/*.tar.gz
            releases/*.AppImage
          retention-days: 7

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Download macOS DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-dmg-*
          path: artifacts/
          merge-multiple: true

      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: artifacts/
          merge-multiple: true

      - name: Prepare release files
        id: prepare_files
        run: |
          DMG_FILES=$(find artifacts -name "*.dmg" -type f | sort | tr '\n' ' ')
          ZIP_FILE=$(find artifacts -name "*.zip" -type f | head -1)
          LINUX_FILES=$(find artifacts \( -name "*linux-*.tar.gz" -o -name "*linux-*.AppImage" \) -type f | sort | tr '\n' ' ')
          
          if [ -z "$DMG_FILES" ]; then
            echo "❌ Error: DMG files not found in artifacts"
            exit 1
          fi
          
          echo "DMG_FILES=$DMG_FILES" >> $GITHUB_OUTPUT
          echo "✅ DMG: $DMG_FILES"
          
          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP_FILE=$ZIP_FILE" >> $GITHUB_OUTPUT
            echo "✅ ZIP: $ZIP_FILE"
            ls -lh "$ZIP_FILE"
          else
            echo "ZIP_FILE=" >> $GITHUB_OUTPUT
            echo "⚠️  Windows ZIP not available"
          fi
          
          echo "LINUX_FILES=$LINUX_FILES" >> $GITHUB_OUTPUT
          echo "✅ Linux: $LINUX_FILES"

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Get previous tag for changelog
          PREVIOUS_TAG=$(git tag --sort=-v:refname | sed -n '2p' || echo "")
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG_URL="https://github.com/${{ github.repository }}/releases/tag/v$VERSION"
          else
            CHANGELOG_URL="https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...v$VERSION"
          fi
          
          cat > release_notes.md << EOF
          # Release v$VERSION
          
          ## Downloads
          
          - **macOS (Apple Silicon)**: [commit-rewriter-$VERSION-macos-arm64.dmg](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-macos-arm64.dmg)
          - **macOS (Intel)**: [commit-rewriter-$VERSION-macos-x86_64.dmg](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-macos-x86_64.dmg)
          $([ -n "${{ steps.prepare_files.outputs.ZIP_FILE }}" ] && echo "- **Windows**: [commit-rewriter-$VERSION-windows-portable.zip](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-windows-portable.zip)" || echo "- **Windows**: Not available")
          - **Linux (x86_64)**: [AppImage](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-linux-x86_64.AppImage) · [tar.gz](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-linux-x86_64.tar.gz)
          - **Linux (ARM64)**: [AppImage](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-linux-arm64.AppImage) · [tar.gz](https://github.com/${{ github.repository }}/releases/download/v$VERSION/commit-rewriter-$VERSION-linux-arm64.tar.gz)
          
          ## Installation
          
          ### macOS
          1. Download the DMG file
          2. Open the DMG and drag the app to Applications
          3. If you see a "damaged" error, open Terminal and run:
             \`\`\`bash
             xattr -d com.apple.quarantine /Applications/Git\ Commit\ Rewriter.app
             \`\`\`
          4. Run from Applications
          
          ### Windows
          1. Download the ZIP file
          2. Extract the archive
          3. Run \`Git Commit Rewriter.exe\`
          
          ### Linux
          1. Download the AppImage for your architecture
          2. Make it executable: \`chmod +x commit-rewriter-$VERSION-linux-*.AppImage\`
          3. Run it: \`./commit-rewriter-$VERSION-linux-*.AppImage\`
          
          Or extract the tar.gz and run \`commit-rewriter\` (requires GTK 3).
          
          ---
          
          **Full Changelog**: $CHANGELOG_URL
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_FILES="${{ steps.prepare_files.outputs.DMG_FILES }}"
          ZIP_FILE="${{ steps.prepare_files.outputs.ZIP_FILE }}"
          LINUX_FILES="${{ steps.prepare_files.outputs.LINUX_FILES }}"
          
          # Prepare files list for upload
          FILES_TO_UPLOAD=()
          for FILE in $DMG_FILES; do
            FILES_TO_UPLOAD+=("$FILE")
          done
          if [ -n "$ZIP_FILE" ] && [ -f "$ZIP_FILE" ]; then
            FILES_TO_UPLOAD+=("$ZIP_FILE")
          fi
          for FILE in $LINUX_FILES; do
            FILES_TO_UPLOAD+=("$FILE")
          done
          
          if [ ${#FILES_TO_UPLOAD[@]} -eq 0 ]; then
            echo "❌ Error: No files to upload"
            exit 1
          fi
          
          echo "Files to upload: ${FILES_TO_UPLOAD[@]}"
          
          # Try GitHub CLI first
          if command -v gh &> /dev/null; then
            echo "Using GitHub CLI..."
            gh auth status || gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"
            
            if gh release create "v$VERSION" \
              --title "Release v$VERSION" \
              --notes-file release_notes.md \
              "${FILES_TO_UPLOAD[@]}"; then
              echo "✅ Release created successfully with GitHub CLI"
              exit 0
            else
              echo "⚠️  GitHub CLI failed, falling back to API"
            fi
          fi
          
          # Fallback to API
          echo "Using GitHub API..."
          TOKEN="${{ secrets.GITHUB_TOKEN }}"
          
          # Prepare release body (escape JSON)
          RELEASE_BODY=$(cat release_notes.md | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
          
          # Create release
          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{\"tag_name\":\"v$VERSION\",\"name\":\"Release v$VERSION\",\"body\":\"$RELEASE_BODY\"}")
          
          HTTP_CODE=$(echo "$RELEASE_RESPONSE" | tail -n1)
          RELEASE_BODY=$(echo "$RELEASE_RESPONSE" | head -n-1)
          
          if [ "$HTTP_CODE" != "201" ]; then
            echo "❌ Error creating release. HTTP code: $HTTP_CODE"
            echo "Response: $RELEASE_BODY"
            exit 1
          fi
          
          UPLOAD_URL=$(echo "$RELEASE_BODY" | grep -o '"upload_url":"[^"]*' | cut -d'"' -f4 | sed 's/{?name,label}//')
          
          if [ -z "$UPLOAD_URL" ]; then
            echo "❌ Error: Could not extract upload URL"
            exit 1
          fi
          
          echo "Upload URL: $UPLOAD_URL"
          
          # Upload files
          for FILE in "${FILES_TO_UPLOAD[@]}"; do
            FILE_NAME=$(basename "$FILE")
            echo "Uploading $FILE_NAME..."
            
            UPLOAD_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
              -H "Authorization: token $TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$FILE" \
              "$UPLOAD_URL?name=$FILE_NAME")
            
            UPLOAD_HTTP_CODE=$(echo "$UPLOAD_RESPONSE" | tail -n1)
            if [ "$UPLOAD_HTTP_CODE" = "201" ]; then
              echo "✅ $FILE_NAME uploaded successfully"
            else
              echo "⚠️  Warning: $FILE_NAME upload failed. HTTP code: $UPLOAD_HTTP_CODE"
            fi
          done
          
          echo "✅ Release v$VERSION created successfully!"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

